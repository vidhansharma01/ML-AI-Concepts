[project]
name = "langgraphcourse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vidhan", email = "vidhansharma01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langsmith>=0.12.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langgraphcourse = "langgraphcourse:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
